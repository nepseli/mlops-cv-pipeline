# Fast, dependency-free validation. Runs on every push and PR and requires no
# cloud credentials, so a fork gets a green build immediately.
# Anything needing AWS lives in deploy.yaml, which is gated.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install --disable-pip-version-check ruff
      - name: Lint (rules pinned in ruff.toml)
        run: ruff check .
      - name: Compile all sources
        run: python -m compileall -q serving training monitoring

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Parse every manifest (placeholders substituted with dummies)
        run: |
          pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import glob, re, sys, yaml
          files = (glob.glob("k8s/*.yaml") + glob.glob("monitoring/*.yaml")
                   + glob.glob("infra/*.yaml") + ["params.yaml", "dvc.yaml"])
          bad = []
          for f in files:
              text = re.sub(r"\$\{[A-Z_]+\}", "placeholder", open(f).read())
              try:
                  list(yaml.safe_load_all(text))
                  print(f"ok   {f}")
              except yaml.YAMLError as exc:
                  bad.append(f)
                  print(f"FAIL {f}: {exc}")
          sys.exit(1 if bad else 0)
          PY
      - name: Render manifests the way `make render` does
        run: |
          set -euo pipefail
          mkdir -p build
          export ECR=123456789012.dkr.ecr.us-east-1.amazonaws.com
          export MLFLOW_BUCKET=example-bucket IMAGE_TAG=ci
          for f in k8s/*.yaml; do
            envsubst '$ECR $MLFLOW_BUCKET $IMAGE_TAG' < "$f" > "build/$(basename "$f")"
          done
          grep -q "$ECR" build/serving.yaml && echo "render OK"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history so the scan covers every commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build images (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Placeholder model so the serving image can build
        run: touch serving/model.onnx
      - name: Build serving image
        run: docker build -t cv-serving:ci -f serving/Dockerfile .
      - name: Build drift image
        run: docker build -t cv-drift:ci -f monitoring/drift/Dockerfile .
