# Grafana sidecar auto-imports any ConfigMap labeled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cv-model-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cv-model.json: |
    {
      "title": "CV Model Ops",
      "uid": "cv-model-ops",
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Request rate (req/s)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
         "targets": [{"expr": "sum(rate(inference_requests_total[5m])) by (status)"}]},
        {"id": 2, "type": "timeseries", "title": "Latency p50 / p95 (s)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
         "targets": [
           {"expr": "histogram_quantile(0.5, sum(rate(inference_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p50"},
           {"expr": "histogram_quantile(0.95, sum(rate(inference_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p95"}]},
        {"id": 3, "type": "timeseries", "title": "Detections by class (per min)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
         "targets": [{"expr": "sum(rate(detections_total[5m])) by (class_name) * 60"}]},
        {"id": 4, "type": "timeseries", "title": "Median detection confidence",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
         "targets": [{"expr": "histogram_quantile(0.5, sum(rate(detection_confidence_bucket[30m])) by (le))"}]},
        {"id": 5, "type": "stat", "title": "Dataset drift detected",
         "gridPos": {"h": 6, "w": 6, "x": 0, "y": 16},
         "targets": [{"expr": "dataset_drift_detected{job=\"drift-detector\"}"}]},
        {"id": 6, "type": "stat", "title": "Drift share",
         "gridPos": {"h": 6, "w": 6, "x": 6, "y": 16},
         "targets": [{"expr": "drift_share{job=\"drift-detector\"}"}]},
        {"id": 7, "type": "timeseries", "title": "Per-feature drift score",
         "gridPos": {"h": 6, "w": 12, "x": 12, "y": 16},
         "targets": [{"expr": "feature_drift_score{job=\"drift-detector\"}", "legendFormat": "{{feature}}"}]}
      ],
      "schemaVersion": 39
    }
